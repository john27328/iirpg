[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iirpg"
version = "0.1.0"
description = "A chat and JSON test stub sharing a text RPG message queue."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
iirpg = "iirpg.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iirpg = ["web/*"]
