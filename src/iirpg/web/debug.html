<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111414">
  <title>Отладка — IIRPG</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body data-view="debug">
  <div class="workspace">
    <header class="topbar">
      <a class="brand" href="/" aria-label="IIRPG — главная"><span class="brand-mark">ii</span>IIRPG <span class="brand-label">ОТЛАДКА</span></a>
      <nav class="page-nav" aria-label="Страницы"><a href="/" class="page-link alternate-view">Игра</a><a href="/battle" class="page-link">Бой</a><a href="/debug" class="page-link" aria-current="page">Отладка</a></nav>
      <div class="connection" role="status"><span class="status-dot"></span><span id="connection-label">Подключение…</span></div>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div><div class="eyebrow">ИНСПЕКТОР КОМНАТЫ <span> / DEBUG</span></div><h1 id="page-title">Внутри игры. <span>Сущности и события.</span></h1><p>Проверяйте состояние комнаты, отправляйте команды ведущего и читайте полную очередь.</p></div>
        <div class="room-actions"><button id="copy-link" class="button-secondary" disabled>Скопировать ссылку</button><button id="new-room" class="button-icon" title="Новый диалог" aria-label="Начать новый диалог" disabled>＋</button></div>
      </section>
      <div id="notice" class="notice" role="alert" hidden></div>
      <form id="access-gate" class="notice access-gate" hidden><label for="access-key">Ключ доступа к диалогу</label><input id="access-key" type="password" autocomplete="current-password" placeholder="Вставьте ключ из вашей ссылки" required><button class="button-secondary" type="submit">Открыть чат</button></form>
      <div class="debug-workspace"><section id="debug-inspector" class="debug-inspector" aria-label="Внутренние сущности"></section><section id="chats" class="chats debug-tools" aria-label="Команды ведущего и JSON-заглушка"></section></div>
      <section id="debug-log" class="debug-log" aria-label="Полный лог чата"></section>
      <footer class="workspace-footer"><span><span class="small-dot"></span> Административный стенд · Все события комнаты</span><span>История сохраняется автоматически</span></footer>
    </main>
  </div>
  <template id="json-stub-template">
    <article class="chat second json-stub">
      <header class="chat-header"><div class="avatar" aria-hidden="true">{ }</div><div><h2>JSON-заглушка</h2><p class="chat-subtitle">Входящие записи очереди · second</p></div><span class="chat-number">JSON</span></header>
      <div class="message-list json-log" role="log" aria-live="polite" aria-relevant="additions" tabindex="0"><div class="empty-state"><div class="empty-icon" aria-hidden="true">{ }</div><h3>Входящие JSON-сообщения</h3><p>Доступные заглушке записи<br>появятся здесь целиком.</p></div></div>
      <form class="composer json-composer">
        <div class="visibility-control"><label for="json-mode">Формат отправки</label><select id="json-mode" class="json-mode visibility-select" disabled><option value="command">Команда ведущего</option><option value="raw">Сырой JSON очереди</option></select></div>
        <div class="visibility-control"><label for="json-input">Отправить JSON в очередь</label><span class="json-template-actions"><button class="json-dice-offer json-new-id" type="button" disabled>Предложить бросок</button><button class="json-dice-example json-new-id" type="button" disabled>Пример костей</button><button class="json-new-id json-renew-id" type="button" title="Изменить только request_id для нового сообщения" disabled>Новый request_id</button></span></div>
        <textarea id="json-input" class="json-input" rows="10" spellcheck="false" autocapitalize="off" autocomplete="off" aria-describedby="json-hint" disabled></textarea>
        <div class="json-actions"><span id="json-hint">Объект отправляется как введён.<br>Повтор с тем же ID не создаёт дубль.</span><button class="button-secondary json-send" type="submit" disabled>Отправить JSON</button></div>
        <p class="json-status" role="status" hidden></p><p class="form-error" role="alert" hidden></p>
      </form>
    </article>
  </template>
</body>
</html>
